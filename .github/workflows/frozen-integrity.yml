name: Frozen integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify Frozen-zone hashes
        run: python scripts/verify_frozen.py
