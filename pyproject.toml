# `except:` telanjang di parser metadata YouTube (:317, :323) — juga menelan
# KeyboardInterrupt, sehingga Ctrl-C tidak responsif saat operasi video
# panjang. Lihat AUDIT_FINDINGS_CODE.md §9c.
"actions/youtube_video.py" = ["E722", "S110", "S112"]   # +6 (§35)

# `image_base64` dihitung lalu tidak pernah dipakai (:455) — sisa refactor ke
# `image_bytes`. Menghapusnya membuang panggilan fungsi; perlu dibaca dulu.
"actions/code_helper.py" = ["F841", "S110", "S112"]   # +2 (§35)

# `page = browser.new_page()` (:47) tidak pernah dipakai. BUKAN sekadar
# variabel mati — assignment ini punya efek samping (membuat halaman), jadi
# ini penanda kode mati di modul warisan. Jangan dihapus mekanis.
"core/social_manager.py" = ["F841"]

# `except ... as e` tanpa memakai `e` (:373).
"jarvis/agent/tools/google_youtube.py" = ["F841", "S110", "S112"]   # +5 (§35)

# `pid = self._selected` (:1302) tidak terpakai — assignment mati murni.
"jarvis/ui/panels.py" = ["F841"]

# Konfigurasi pytest SENGAJA tidak ditaruh di sini. `pytest.ini` yang menang
# secara presedensi, dan tests/test_architecture_inventory.py:11-13 menegaskan
# berkas itu ada beserta isinya — dua sumber kebenaran hanya akan membingungkan.

# ── CATATAN numpy (dipindahkan dari requirements-xlix.txt agar tidak hilang) ──
# Spesifikasi awal menyarankan numpy<2.0 demi MediaPipe, tetapi lingkungan ini
# menjalankan mediapipe 0.10.13 + ultralytics 8.4 + opencv 4.13 dengan baik di
# numpy 2.5, dan build opencv/ultralytics yang terpasang JUSTRU MEMBUTUHKAN
# numpy 2.x. Jangan turunkan versinya kecuali impor mediapipe benar-benar gagal
# di mesin Anda.
#
# ── Kapabilitas opsional yang sengaja TIDAK dijadikan dependensi ─────────────
# Ketiganya degrade dengan anggun bila tidak ada:
#   faiss-cpu     → memori semantik (memory.faiss); nonaktif bila hilang
#   pytesseract   → fallback OCR untuk screen awareness; pelacakan judul
#                   jendela tetap bekerja tanpanya
#   duckduckgo-search → nama paket lama; `ddgs` di atas menggantikannya,
#                   actions/web_search.py:74-76 masih menerima keduanya
#   pynvml        → statistik GPU (ui.py:116, actions/system_monitor.py:75,
#                   jarvis/ui/overlays.py:127); semuanya impor ter-guard,
#                   panel tetap jalan tanpa angka GPU
#   matplotlib    → core/camera_vision.py:10, impor ter-guard
#
# Ditemukan lewat pengukuran: menjalankan seluruh suite lalu memeriksa
# sys.modules. `croniter` dan `SpeechRecognition` TIDAK ada di kedua
# requirements lama meski keduanya impor langsung — itulah sumber
# "ModuleNotFoundError" yang diakui readme.md.
